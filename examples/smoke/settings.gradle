pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }
    def pluginProperties = new Properties()
    file('../../gradle.properties').withInputStream { pluginProperties.load(it) }
    plugins {
        id 'io.github.nanofaas.control-plane-modules' version pluginProperties.getProperty('version')
    }
}

plugins {
    id 'io.github.nanofaas.control-plane-modules'
}

rootProject.name = 'nanofaas-plugin-smoke'
